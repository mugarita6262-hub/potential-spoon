# 楽天ROOM 投稿ツール 設定
# 主な項目は GUI の『⚙ 設定』から変更できます（このファイルを直接編集する必要はありません）
# scoring / per_genre / favorites などの詳細はここで調整します

my_room_url: https://room.rakuten.co.jp/room_e36e002876/items
post_count: 15
candidate_pool: 40
post_batch_size: 10
sale_boost:
  enabled: true
  five_ten_day_multiplier: 1.3
  event_multiplier: 1.8
  max_multiplier: 2.0
  auto_detect: true
  event_name_ratio: 0.12
  manual_events:
  - name: スーパーSALE
    start: '2026-09-04'
    end: '2026-09-11'
prune:
  enabled: true
  mode: oldest
  only_before: '2025-01-01'
  prefer_zero_engagement: true
  max_delete_per_run: 15
  delete_interval_seconds:
  - 3
  - 7
post_interval_seconds:
- 60
- 90
sources:
  favorites:
    enabled: true
    url: https://my.bookmark.rakuten.co.jp/
    manual_list_file: data/favorites.txt
  ranking:
    enabled: true
    genre_ids:
    - 0
    - 100939
    - 100804
    - 100227
    - 558885
    per_genre: 25
scoring:
  weights:
    review_count: 0.35
    review_average: 0.2
    ranking_rank: 0.25
    price_fit: 0.1
    point_rate: 0.1
  price_band:
  - 1000
  - 8000
  min_review_count: 5
  min_review_average: 3.8
exclude:
  reposted_within_days: 60
engage:
  caps:
    like_per_day: 200
    like_per_hour: 35
    follow_per_day: 80
    follow_per_hour: 15
    unfollow_per_day: 60
  like_interval:
  - 5
  - 13
  follow_interval:
  - 8
  - 20
  unfollow_after_days: 10
  daily_likes: 55
  daily_follows: 25
  daily_prune: 300
  daily_gap_minutes:
  - 2
  - 6
sns:
  enabled: true
  run_in_daily: false
  lookback_days: 30
  min_discount_pct: 10
  repost_cooldown_days: 30
  threads:
    enabled: true
    post_count: 1
    interval_seconds:
    - 20
    - 45
    disclosure: PR
