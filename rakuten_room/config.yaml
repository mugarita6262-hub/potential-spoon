# 楽天ROOM 投稿ツール 設定
# 主な項目は GUI の『⚙ 設定』から変更できます（このファイルを直接編集する必要はありません）
# scoring / per_genre / favorites などの詳細はここで調整します

my_room_url: https://room.rakuten.co.jp/room_e36e002876/items
post_count: 100
# 2026-10-20: 5と0の日（目標195件）に候補194件・紹介文182件で足りず164件止まり。セール最大2倍（300件）でも足りる数に
candidate_pool: 360
post_batch_size: 28  # セール期間は目標が1.3倍(最大195件)になるので、8回で届くように
# 期間限定の上乗せ（削除ジョブの不具合で消えた投稿の取り戻し）。until を過ぎると自動で元の post_count に戻る
post_boost:
  extra: 50
  until: '2026-10-27'
# 2026-10-18: フォローは 10/11〜18 に候補不足で目標の3割前後、不足1,079件。10/19〜22 は1日 +300件（200→500）で取り戻す
follow_boost:
  extra: 0  # 2026-10-23 終了（daily_follows を500にした）
  until: '2026-10-23'
sale_boost:
  enabled: true
  # 商品名にクーポン・割引・ポイント倍がある商品への加点（選ぶとき）
  bonus: 0.12
  # 楽天APIのポイント倍率での加点（売れたクリスマスツリーは店内全品P10倍だった）
  point_bonus:
    5: 0.06
    10: 0.12
  five_ten_day_multiplier: 1.3
  event_multiplier: 1.8
  max_multiplier: 2.0
  auto_detect: true
  event_name_ratio: 0.12
  manual_events:
  - name: スーパーSALE
    start: '2026-09-04'
    end: '2026-09-11'
# 2026-10-23: マイコレクションを毎晩入れ替える。各コレクションは新しい max_items 件だけ残し、古いものと販売終了を外す
# （コレクションから外すだけで投稿は消さない）
room_collections:
  rotate: true
  max_items: 60
  max_remove_per_night: 400
prune:
  enabled: true
  # 2026-10-18: 消すのは only_before より前（2022年ごろ）の投稿だけ。その中で販売終了 → 古い順。
  # このツールで投稿したもの（2025年以降）は販売終了でも絶対に消さない（ユーザー指示）
  mode: dead
  scan_per_run: 1500
  only_before: '2025-01-01'
  prefer_zero_engagement: true
  max_delete_per_run: 15
  delete_interval_seconds:
  - 3
  - 7
post_interval_seconds:
- 60
- 90
sources:
  ranking:
    enabled: true
    genre_ids:
    - 0
    - 100939
    - 100804
    - 100227
    - 558885
    - 101070
    - 100371
    - 551177
    - 216131
    - 100533
    - 100132
    - 101213
    - 100026
    - 211742
    - 101164
    per_genre: 30
  # 以前使っていた ROOM REPEAT 極 は「SALE」で検索した商品をコレ！していた（2〜3か月で2〜3万円の実績）
  keywords:
    enabled: true
    words:
    - SALE
    - 訳あり
    - クーポン
    - まとめ買い
    # 2026-10-20 追加: ランキングは毎日ほぼ同じ商品で、投稿済みを除くと新しい候補が足りなかった
    - 楽天1位
    - 限定クーポン
    - ポイント10倍
    - 送料無料 人気
    - 大容量
    - 福袋
    - 新作
    - 高評価
    # 2026-10-28〜: いいねが多かった「訳あり・お試し」系に寄せる（10/18〜24 の出どころ別いいね: キーワード5.1 > ランキング4.2 > 季節3.1）
    - お試し
    - お試しセット
    - ふるさと納税 訳あり
    - 訳あり 食品
    per_keyword: 30
  # 2026-10-18: その月に買われるもの。10/16にクリスマスツリーが売れた
  seasonal:
    enabled: true
    per_word: 20
    max_share: 0.1  # 1日の投稿のうち季節ものは1割まで（2026-10-28〜。いいねが最も低かったため 2割→1割）
    months:
      1: [福袋, 加湿器, 電気毛布, 節分, バレンタイン チョコ]
      2: [バレンタイン チョコ, ひな人形, 新生活 家電, 加湿器]
      3: [新生活 家電, 入学祝い, 卒業 ギフト, 収納 ケース]
      4: [母の日 ギフト, 新生活, 日傘, レインコート]
      5: [母の日 ギフト, 父の日 ギフト, 日傘, 梅雨 対策]
      6: [父の日 ギフト, 扇風機, 日傘, お中元]
      7: [お中元, 扇風機, 冷感 敷きパッド, 水筒]
      8: [防災 グッズ, 扇風機, 冷感 敷きパッド, 敬老の日 ギフト]
      9: [防災 グッズ, 敬老の日 ギフト, ハロウィン, 秋冬 ニット]
      10: [クリスマスツリー, 電気毛布, 着る毛布, 加湿器, おせち 予約, ハロウィン]
      11: [クリスマスツリー, クリスマスプレゼント, お歳暮, おせち 予約, 電気毛布, 加湿器, カレンダー 2027]
      12: [クリスマスプレゼント, お歳暮, おせち, 福袋, 年越しそば, 大掃除, 加湿器]
  # 売れた商品のショップの人気商品（楽天アフィリエイトの注文明細から。data/sold_shops.json にショップを記録）
  sold_shops:
    enabled: true
    per_shop: 15
    max_share: 0.1  # 1日の投稿のうち売れた店の商品は1割まで（2店だけで17%になった）
    bonus: 0.05
  # ROOM内で反応が出ている商品（以前のツールの方式。商品だけ借りて紹介文は自分で書く）
  room_search:
    enabled: true
    words:
    - コスメ
    - スキンケア
    - ヘアケア
    - ニット
    - アウター
    - ワンピース
    - スニーカー
    - バッグ
    - インテリア
    - 収納
    - キッズ
    - ベビー
    - プチプラ
    - ギフト
    - あったか
    - 便利グッズ
    per_run_words: 16  # 2026-10-20: 6→16・2→3ページ・40→120件（候補不足のため）
    pages: 3
    min_likes: 300
    max_items: 120
scoring:
  weights:
    review_count: 0.35
    review_average: 0.2
    ranking_rank: 0.25
    price_fit: 0.1
    point_rate: 0  # ポイントは sale_boost.point_bonus（楽天APIの倍率・期間内）で1回だけ数える（2026-10-18）
  price_band:
  - 500
  - 20000
  min_review_count: 5
  min_review_average: 3.8
exclude:
  reposted_within_days: 60
# ほっといても売れる定番の売れ筋（ランキング入り＋レビュー5000件以上★4.3以上、または30日中7日以上ランクイン）
# セール・クーポンで今お得な商品を優先（売れた商品はどちらもクーポン・ポイント倍のセール中だった）
evergreen:
  min_reviews: 5000
  min_average: 4.3
  min_rank_days: 7
  repost_after_days: 21
  score_bonus: 0.15
engage:
  # 2026-10-11 以前使っていた ROOM REPEAT 極 と同じく ROOM の制限近くまで動かす（ユーザー判断）
  caps:
    like_per_day: 700
    like_per_hour: 130
    follow_per_day: 800
    follow_per_hour: 90
    unfollow_per_day: 800
  like_interval:
  - 3
  - 8
  follow_interval:
  - 4
  - 10
  unfollow_after_days: 7
  # フォロー中がこれを超えたら、返してくれている人を古い順に解除して枠を空ける（ROOMの上限1万人。2026-10-23）
  following_keep_below: 9000
  daily_unfollows: 800
  followback_per_run: 80
  daily_likes: 700  # 上限 like_per_day 700 まで使う（2026-10-18 に500→700。1回88件・1時間130件以内）
  daily_follows: 500  # 2026-10-23: 取り戻し期間（500件）でフォロワーが1日+250人前後に伸びたので、500件を通常にする
  daily_prune: 600  # 2025年より前の投稿（12,869件・2022〜23年）を約3週間で消し切る（2026-10-22 に150→600、1回200件×3回）
  daily_gap_minutes:
  - 2
  - 6
sitedrop:
  enabled: false  # 2026-10-20 Threadsは停止（フォロワー11人・サイトへの訪問1日1人・クリック0。ユーザー判断）
  repost_cooldown_days: 2
  min_drops: 3
  disclosure: PR
calendar:
  enabled: false  # 2026-10-20 Threadsは停止（フォロワー11人・サイトへの訪問1日1人・クリック0。ユーザー判断）
  run_in_daily: false
trivia:
  enabled: false  # 2026-10-20 Threadsは停止（フォロワー11人・サイトへの訪問1日1人・クリック0。ユーザー判断）
  run_in_daily: false
  repost_cooldown_days: 7
  topics:
  - トイレットペーパーは1mあたりの値段で比べる
  - お米は袋の大きさで1kgあたりがどう変わるか
  - 洗剤は詰め替えと本体どちらが割安か
  - ペットフードは大袋と小袋どちらが得か
  - コーヒーは豆とドリップバッグで1杯あたりがどう違うか
  - 値下がりしたかどうかは「いつもの値段」と比べて判断する
  - ティッシュ・キッチンペーパーのまとめ買いの目安
  - 水・炭酸水は1本あたりの値段で比べる
  - セールの前に値段が上がっていないか確かめる方法
  - 送料込みで比べないと損するパターン
  - レビュー件数が多い定番品の「いつもの値段」の覚え方
  - 買い置きしすぎない日用品のストックの考え方
server:
  enabled: true
  prepare_window:
  - 06:00
  - 06:45
  prepare_runs_per_day: 1
  # 2026-10-18: 夕方にも価格を取り直して、夜の値下がり速報とサイトの数字を新しくする
  site_window:
  - - '05:00'
    - '05:45'
  - - '15:30'
    - '16:15'
  site_runs_per_day: 2
  # 2026-10-17: 売れた2件はどちらも昼前後の投稿から1〜2時間で購入されたので、昼（10:30〜14:30）に半分ほど寄せる
  room_post_window:
  - - '07:30'
    - '08:30'
  - - '10:30'
    - '14:30'
  - - '18:00'
    - '19:00'
  - - '20:00'
    - '22:00'
  room_post_runs_per_day: 8
  # 2026-10-19: 1回88件だと回が1時間以内に重なったとき上限（1時間130件）に当たり、42件で止まった。
  # 1つの時間帯を11等分して置く（最短の間隔 約60分）。1回64件なので、1時間に2回入っても128件
  room_like_window:
  - '09:00'
  - '22:45'
  room_like_runs_per_day: 11
  # 2026-10-19: 6回×84件は余裕が4件しかなく、回が1時間以内に重なると上限（1時間90件）で6件・39件に削られた。
  # 1つの時間帯を12等分して置く（最短の間隔 約55分）。1回42件なので、1時間に2回入っても84件
  room_follow_window:
  - '09:00'
  - '22:45'
  room_follow_runs_per_day: 12
  room_unfollow_window:
  - - 09:30
    - '12:00'
  - - '13:00'
    - '16:30'
  - - '18:00'
    - '20:00'
  - - '21:30'
    - '23:30'
  room_unfollow_runs_per_day: 4
  room_prune_window:
  - - 09:30
    - '11:30'
  - - '14:00'
    - '18:30'
  - - '22:45'
    - '23:50'
  room_prune_runs_per_day: 3
  room_collect_window:
  - - '23:15'
    - '23:55'
  room_collect_runs_per_day: 1
  # 毎晩、その日の予定と実績をスマホに通知（2026-10-18〜。ほかのジョブが失敗しても届くよう独立したジョブ）
  report_window:
  - - '23:56'
    - '23:59'
  report_runs_per_day: 1
  # 2026-10-18: Threadsは値下がり情報アカウント。否定レビューを受けて値下がり速報は昼1本＋夜1本
  # （3件以上のジャンルだけ。無ければ出さない）。判定は2026-11-30（Threads経由の楽天クリック累計30回）
  sitedrop_window:
  - - '12:00'
    - '13:00'
  - - '20:00'
    - '21:30'
  sitedrop_runs_per_day: 0
  calendar_window:
  - '19:00'
  - '21:00'
  calendar_runs_per_day: 0
  # 買い物・値段の知識（具体的な品目）で表示を稼ぐ。朝と夜遅めの2本
  trivia_window:
  - - '07:30'
    - '09:00'
  - - '21:45'
    - '23:00'
  trivia_runs_per_day: 0
  instagram_window:
  - - '19:00'
    - '21:00'
  instagram_runs_per_day: 0
posting_limits:
  max_per_day: 10
  instagram_max_per_day: 1
instagram:
  enabled: false  # 2026-10-20 停止（フォロワー7人・直近1週間のリーチ0。ユーザー判断）
  run_in_daily: false
  repost_cooldown_days: 14
  disclosure: PR
