# 楽天ROOM 投稿ツール 設定
# 主な項目は GUI の『⚙ 設定』から変更できます（このファイルを直接編集する必要はありません）
# scoring / per_genre / favorites などの詳細はここで調整します

my_room_url: https://room.rakuten.co.jp/room_e36e002876/items
post_count: 100
candidate_pool: 150
post_batch_size: 28  # セール期間は目標が1.3倍(最大195件)になるので、8回で届くように
# 期間限定の上乗せ（削除ジョブの不具合で消えた投稿の取り戻し）。until を過ぎると自動で元の post_count に戻る
post_boost:
  extra: 50
  until: '2026-10-27'
sale_boost:
  enabled: true
  five_ten_day_multiplier: 1.3
  event_multiplier: 1.8
  max_multiplier: 2.0
  auto_detect: true
  event_name_ratio: 0.12
  manual_events:
  - name: スーパーSALE
    start: '2026-09-04'
    end: '2026-09-11'
prune:
  enabled: true
  mode: oldest
  only_before: '2025-01-01'
  prefer_zero_engagement: true
  max_delete_per_run: 15
  delete_interval_seconds:
  - 3
  - 7
post_interval_seconds:
- 60
- 90
sources:
  favorites:
    enabled: true
    url: https://my.bookmark.rakuten.co.jp/
    manual_list_file: data/favorites.txt
  ranking:
    enabled: true
    genre_ids:
    - 0
    - 100939
    - 100804
    - 100227
    - 558885
    - 101070
    - 100371
    - 551177
    - 216131
    - 100533
    - 100132
    - 101213
    - 100026
    - 211742
    - 101164
    per_genre: 30
  # 以前使っていた ROOM REPEAT 極 は「SALE」で検索した商品をコレ！していた（2〜3か月で2〜3万円の実績）
  keywords:
    enabled: true
    words:
    - SALE
    - 訳あり
    - クーポン
    - まとめ買い
    per_keyword: 30
scoring:
  weights:
    review_count: 0.35
    review_average: 0.2
    ranking_rank: 0.25
    price_fit: 0.1
    point_rate: 0.1
  price_band:
  - 500
  - 20000
  min_review_count: 5
  min_review_average: 3.8
exclude:
  reposted_within_days: 60
engage:
  # 2026-10-11 以前使っていた ROOM REPEAT 極 と同じく ROOM の制限近くまで動かす（ユーザー判断）
  caps:
    like_per_day: 700
    like_per_hour: 130
    follow_per_day: 800
    follow_per_hour: 90
    unfollow_per_day: 800
  like_interval:
  - 3
  - 8
  follow_interval:
  - 4
  - 10
  unfollow_after_days: 7
  daily_unfollows: 800
  followback_per_run: 80
  daily_likes: 500
  daily_follows: 200
  daily_prune: 300
  daily_gap_minutes:
  - 2
  - 6
sns:
  enabled: true
  run_in_daily: false
  lookback_days: 30
  min_discount_pct: 10
  repost_cooldown_days: 30
  threads:
    enabled: true
    post_count: 1
    interval_seconds:
    - 20
    - 45
    disclosure: PR
research:
  enabled: true
  extra_genre_ids:
  - 101070
  - 100371
  - 551177
  - 216131
  - 100533
  - 100132
  - 101213
  - 100026
  - 211742
  - 101164
a8:
  enabled: true
  run_in_daily: false
  repost_cooldown_days: 10
  disclosure: PR
digest:
  enabled: true
  run_in_daily: false
  repost_cooldown_days: 5
  disclosure: PR
sitepost:
  enabled: true
  repost_cooldown_days: 21
  disclosure: PR
sitedrop:
  enabled: true
  repost_cooldown_days: 3
  min_drops: 2
  disclosure: PR
# 2026-10-07: リンクなしで空振りも多かったので、サイトへの流入を作る sitedrop に置き換え
